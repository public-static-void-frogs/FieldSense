# Crop catalog for the rotation rule engine.
#
# Rules are written against GROUPS and TRAITS, so adding a crop means adding an entry here,
# not a rule. A crop-level trait always overrides the group value. A trait is either a bare
# value (treated as verified, no citation) or a mapping:
#   value: <scalar or list>; verified: true|false; source: <citation>; text: <original range>
# Values marked verified: false come from local-notes/research/crop_coefficients.csv rows the
# researcher flagged UNVERIFIED, or from group-level proxies. Rules that depend on them are
# downgraded to weak evidence and listed under data gaps.
#
# Group default calendars are day-of-year medians for the pilot region (Iowa) used only when
# no NASS crop-progress calendar exists for the crop; the response labels them "group default".
version: "2026-11-15"

groups:
