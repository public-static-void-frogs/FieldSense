# Crop catalog for the rotation rule engine.
#
# Rules are written against GROUPS and TRAITS, so adding a crop means adding an entry here,
# not a rule. A crop-level trait always overrides the group value. A trait is either a bare
# value (treated as verified, no citation) or a mapping:
#   value: <scalar or list>; verified: true|false; source: <citation>; text: <original range>
# Values marked verified: false come from local-notes/research/crop_coefficients.csv rows the
# researcher flagged UNVERIFIED, or from group-level proxies. Rules that depend on them are
# downgraded to weak evidence and listed under data gaps.
#
# Group default calendars are day-of-year medians for the pilot region (Iowa) used only when
# no NASS crop-progress calendar exists for the crop; the response labels them "group default".
version: "2026-11-10"

groups:
  warm_season_grain:
    label: Warm-season grain
    traits:
      family: Poaceae
      season: warm
      lifecycle: annual
      n_fixer: false
      n_demand: high
      water_demand: high
      residue: high
      rusle_c: {value: 0.40, verified: true, source: "OMAFRA C-factor table, grain corn (crop_coefficients.csv S5)"}
      bare_soil_months: {value: 6, verified: false, source: "harvest (Oct) to canopy closure (Jun) in Iowa; calendar estimate"}
      min_return_years: {value: 1, verified: true, source: "crop_coefficients.csv: monoculture tolerated"}
      humus_balance: {value: -800, verified: true, source: "VDLUFA 2014 humus balance, 'Mais/Hirse' group (crop_coefficients.csv S1)"}
      heat_threshold_c: {value: 35, verified: true, source: "UNL CropWatch 2019; Canterra heat factsheet (climate_water_risk.md)"}
      frost_threshold_c: {value: -2.2, verified: true, source: "UKY AGR-192: 28 F for 2 h kills growing point after ~V5"}
      hosts: [corn_rootworm, gray_leaf_spot, northern_corn_leaf_blight, tar_spot]
    calendar: {planted: 124, emerged: 136, flowering: 198, grain_fill: 214, mature: 258, harvested: 292}
  small_grain:
    label: Small grain
    traits:
      family: Poaceae
      season: cool
      lifecycle: annual
      n_fixer: false
      n_demand: medium
      water_demand: medium
      residue: medium
      rusle_c: {value: 0.35, verified: true, source: "OMAFRA C-factor table, cereals (crop_coefficients.csv S5)"}
      bare_soil_months: {value: 3, verified: false, source: "small grains cover the soil early and allow a late-summer cover crop; calendar estimate"}
      min_return_years: {value: 2, verified: true, source: "crop_coefficients.csv: take-all, one-year break minimum"}
      humus_balance: {value: -400, verified: true, source: "VDLUFA 2014, cereals conventional (crop_coefficients.csv S1)"}
      heat_threshold_c: {value: 30, verified: true, source: "Plant Soil Environ 2017 wheat anthesis >30 C (climate_water_risk.md)"}
      frost_threshold_c: {value: -4, verified: false, source: "no sourced value for spring cereal seedlings; placeholder"}
      hosts: [take_all, fusarium_head_blight]
    calendar: {planted: 104, emerged: 121, flowering: 157, grain_fill: 185, mature: 196, harvested: 208}
  grain_legume:
    label: Grain legume
    traits:
      family: Fabaceae
      season: warm
      lifecycle: annual
      n_fixer: true
      n_demand: low
      water_demand: medium
      residue: low
      rusle_c: {value: 0.50, verified: false, source: "OMAFRA row-crop proxy (crop_coefficients.csv)"}
      bare_soil_months: {value: 7, verified: false, source: "low residue after harvest; calendar estimate"}
      min_return_years: {value: 1, verified: false, source: "SCN and white mold argue for >=1 non-host year (pest_disease_rules.md)"}
      humus_balance: {value: 160, verified: true, source: "VDLUFA 2014, grain legumes (crop_coefficients.csv S1)"}
      n_credit_kg_ha: {value: 35, verified: true, text: "28-50", source: "NE 25-45 lb/ac, WI 40 lb/ac (crop_coefficients.csv)"}
      heat_threshold_c: {value: 35, verified: false, source: "no sourced soybean flowering heat threshold retrieved; corn value reused"}
      frost_threshold_c: {value: -2, verified: false, source: "no sourced killing-frost value for soybean seedlings; placeholder"}
      hosts: [soybean_cyst_nematode, white_mold, sudden_death_syndrome]
    calendar: {planted: 127, emerged: 141, flowering: 192, grain_fill: 207, mature: 261, harvested: 291}
  perennial_forage_legume:
    label: Perennial forage legume
    traits:
      family: Fabaceae
      season: cool
      lifecycle: perennial
      n_fixer: true
      n_demand: low
      water_demand: high
      residue: high
      rusle_c: {value: 0.02, verified: true, source: "RUSLE C for established forage legume (crop_coefficients.csv)"}
      bare_soil_months: 0
      min_return_years: {value: 3, verified: false, source: "clover rot interval 3-5 yr UNVERIFIED (crop_coefficients.csv)"}
      humus_balance: {value: 800, verified: true, source: "VDLUFA 2014, forage legumes per main-use year (crop_coefficients.csv S1)"}
      n_credit_kg_ha: {value: 150, verified: true, text: "146-213", source: "WI 130-190 lb/ac good-fair stand (crop_coefficients.csv)"}
      heat_threshold_c: {value: 35, verified: false, source: "no sourced alfalfa heat threshold; placeholder"}
      frost_threshold_c: {value: -6, verified: false, source: "alfalfa winterkill LT not retrieved; placeholder"}
      hosts: [white_mold]
    calendar: {planted: 110, emerged: 130, flowering: 165, grain_fill: 200, mature: 250, harvested: 280}
  grass_hay_pasture:
    label: Grass hay or pasture
    traits:
      family: Poaceae
      season: cool
      lifecycle: perennial
      n_fixer: false
      n_demand: medium
      water_demand: medium
      residue: high
      rusle_c: {value: 0.02, verified: false, source: "RUSLE C for permanent grass cover; proxy"}
      bare_soil_months: 0
      min_return_years: 0
      humus_balance: {value: 600, verified: false, source: "VDLUFA 'Ackergras' 600-800 HA; proxy"}
      heat_threshold_c: {value: 35, verified: false, source: "placeholder"}
      frost_threshold_c: {value: -8, verified: false, source: "placeholder"}
      hosts: []
    calendar: {planted: 110, emerged: 130, flowering: 165, grain_fill: 200, mature: 250, harvested: 280}
  fallow:
    label: Fallow
    traits:
      family: none
      season: none
      lifecycle: none
      n_fixer: false
      n_demand: low
      water_demand: low
      residue: low
      rusle_c: {value: 1.0, verified: true, source: "RUSLE definition for bare fallow (crop_coefficients.csv S14)"}
      bare_soil_months: 12
      min_return_years: 0
      humus_balance: {value: -200, verified: false, source: "VDLUFA lists no bare fallow; negative by inference"}
      hosts: []
    calendar: {}
  non_crop:
    label: Not cropland
    traits:
      family: none
      season: none
      lifecycle: none
      n_fixer: false
      n_demand: low
      water_demand: low
      residue: low
      rusle_c: 0.0
      bare_soil_months: 0
      min_return_years: 0
      humus_balance: 0
      hosts: []
    calendar: {}

