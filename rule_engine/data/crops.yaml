      residue: high
      rusle_c: {value: 0.40, verified: true, source: "OMAFRA C-factor table, grain corn (crop_coefficients.csv S5)"}
      bare_soil_months: {value: 6, verified: false, source: "harvest (Oct) to canopy closure (Jun) in Iowa; calendar estimate"}
      min_return_years: {value: 1, verified: true, source: "crop_coefficients.csv: monoculture tolerated"}
      humus_balance: {value: -800, verified: true, source: "VDLUFA 2014 humus balance, 'Mais/Hirse' group (crop_coefficients.csv S1)"}
      heat_threshold_c: {value: 35, verified: true, source: "UNL CropWatch 2019; Canterra heat factsheet (climate_water_risk.md)"}
      frost_threshold_c: {value: -2.2, verified: true, source: "UKY AGR-192: 28 F for 2 h kills growing point after ~V5"}
      hosts: [corn_rootworm, gray_leaf_spot, northern_corn_leaf_blight, tar_spot]
    calendar: {planted: 124, emerged: 136, flowering: 198, grain_fill: 214, mature: 258, harvested: 292}
