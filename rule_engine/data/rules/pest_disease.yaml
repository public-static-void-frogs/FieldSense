version: "2026-11-15"
rules:
  - id: corn_rootworm_continuous
    title: Corn rootworm pressure (corn after corn)
    category: pest_disease
    applies_to: {crops: [corn]}
    when:
      - {fact: history.consecutive_same_crop, op: ge, value: 1}
    effect: {kind: risk, level: high}
    evidence_strength: strong
    sources:
      - "ISU ICM News 2015, Corn rootworm management update"
      - "Gassmann (ISU), Bt resistance in western corn rootworm; Seed World 2018"
    needs_local_review: true

  - id: corn_rootworm_alternation
    title: Rotation-resistant rootworm variants (long corn-soy alternation)
    category: pest_disease
    applies_to: {crops: [corn]}
    when:
      - {fact: history.consecutive_same_crop, op: eq, value: 0}
      - {fact: history.corn_soy_alternation_years, op: ge, value: 4}
    effect: {kind: risk, level: medium}
    evidence_strength: moderate
    sources:
      - "ISU ICM News 2015, Corn rootworm management update"
      - "ESA 2009 abstract, rotation-resistant WCR distribution in Iowa"
    needs_local_review: true

  - id: corn_leaf_blight_residue
    title: Residue-borne corn leaf diseases
    category: pest_disease
    applies_to: {crops: [corn]}
    when:
      - {fact: history.consecutive_same_crop, op: ge, value: 1}
    effect: {kind: risk, level: medium}
    evidence_strength: strong
    sources:
      - "University of Kentucky PPFS-AG-C-10"
      - "Corteva, Northern corn leaf blight"
    needs_local_review: false

  - id: scn_soy_after_soy
    title: Soybean cyst nematode build-up
    category: pest_disease
    applies_to: {traits: ["hosts~soybean_cyst_nematode"]}
    when:
      - {fact: history.shared_hosts_prev1, op: contains, value: soybean_cyst_nematode}
    effect: {kind: risk, level: high}
    evidence_strength: strong
    sources:
      - "UNL CropWatch 2021, Managing soybean cyst nematode"
      - "MSU Extension pub 1293"
    needs_local_review: true

  - id: scn_soy_share_5y
    title: Soybean-heavy history (SCN)
    category: pest_disease
    applies_to: {crops: [soybeans]}
    when:
      - {fact: history.share_same_crop_5y, op: gt, value: 0.6}
    effect: {kind: risk, level: medium}
    evidence_strength: strong
    sources:
      - "MSU Extension pub 1293"
      - "Purdue CCA 2008, Tylka"
    needs_local_review: true

  - id: white_mold_host_sequence
    title: White mold host sequence
    category: pest_disease
    applies_to: {traits: ["hosts~white_mold"]}
    when:
      - {fact: history.shared_hosts_prev1, op: contains, value: white_mold}
    effect: {kind: risk, level: medium}
    evidence_strength: moderate
    sources:
      - "NDSU Extension, White mold of soybean"
      - "SDSU Extension soybean management"
    needs_local_review: true

  - id: take_all_second_cereal
    title: Take-all (cereal after cereal)
    category: pest_disease
    applies_to: {traits: ["hosts~take_all"]}
    when:
      - {fact: history.shared_hosts_prev1, op: contains, value: take_all}
    # literature range kept; same-field greenness panel, after a host vs a non-host: spring
    # wheat -1.6 +- 0.5 %, durum -2.5 +- 0.5 %, barley -2.8 +- 0.7 %, winter wheat -1.8 +- 0.9 %
    # (vs early-harvested crops); yield floors 3-7 %, the canopy shows ~1/12 of a trial loss
    effect: {kind: risk, level: medium, yield_factor: [0.80, 0.95]}
    evidence_strength: strong
    sources:
      - "AHDB six-year rotation experiment, take-all control"
      - "FieldSense same-field MODIS greenness panel, 2019-2023 (ndvi_rule_panel.py)"
    needs_local_review: false

  - id: fusarium_after_corn
    title: Fusarium head blight after corn
    category: pest_disease
    applies_to: {traits: ["hosts~fusarium_head_blight"]}
    when:
      - {fact: history.prev1.crop, op: in, value: [corn, sorghum]}
    effect: {kind: risk, level: medium}
    evidence_strength: moderate
    sources:
      - "MSU Extension, Fusarium head blight risk assessment models"
    needs_local_review: true

  - id: return_interval_violated
    title: Minimum return interval not met
    category: pest_disease
    applies_to: {groups: [warm_season_grain, small_grain, grain_legume, perennial_forage_legume, fiber_crop, root_crop, paddy_grain]}
    when:
      - {fact: history.years_since_same_family, op: not_null}
      - {fact: history.years_since_same_family, op: lt, value: "@candidate.min_return_years"}
      - {fact: candidate.min_return_years, op: gt, value: 1}
    effect: {kind: risk, level: medium}
    evidence_strength: moderate
    sources:
      - "research/crop_coefficients.csv, min_return_interval_yr"
    uses_traits: [min_return_years]
    needs_local_review: true

  # Yield cost of a short return for the crops whose break matters most. The percentages are
  # worked out here from the yields the sources report, not stated by them.
  - id: peanut_after_peanut_yield_penalty
    title: Peanut after peanut yield drag
    category: pest_disease
    applies_to: {crops: [peanuts]}
    when:
      - {fact: history.consecutive_same_crop, op: ge, value: 1}
    # continuous peanut against a 3-year break, 2,500 / ~3,500 lb/acre (Shellman, 12 years,
    # non-irrigated) = 0.71; continuous against rotated, 3,107 / 4,031 kg/ha (Tifton, subsurface
    # drip) = 0.77
    effect: {kind: risk, level: medium, yield_factor: [0.71, 0.77]}
    evidence_strength: moderate
    sources:
      - "Sorensen and Butts, Peanut Science (continuous vs rotated peanut, subsurface drip, Tifton GA)"
      - "Farm Progress 2014, Shellman GA 12-year peanut rotation study (UGA)"
    needs_local_review: true

  - id: peanut_one_year_break_yield_penalty
    title: Peanut after a one-year break yield drag
    category: pest_disease
    applies_to: {crops: [peanuts]}
    when:
      - {fact: history.years_since_same_crop, op: eq, value: 2}
    # a one-year break adds about 460 lb/acre to continuous peanut (2,960 lb), a three-year break
    # gives about 3,500 lb: 2,960 / 3,500 = 0.85
    effect: {kind: risk, level: low, yield_factor: [0.85, 0.85]}
    evidence_strength: moderate
    sources:
      - "Farm Progress 2014, Shellman GA 12-year peanut rotation study (UGA)"
    needs_local_review: true

  - id: potato_short_rotation_yield_penalty
    title: Potatoes on a short rotation
    category: pest_disease
    applies_to: {crops: [potatoes]}
    when:
      - {fact: history.years_since_same_crop, op: not_null}
      - {fact: history.years_since_same_crop, op: le, value: 2}
    # Idaho: potatoes every other year gave 42 cwt/acre less total yield than a four-year gap;
    # earlier work 30-40 cwt/acre of U.S. No. 1 from a two- to a three-year interval. Divided by
    # the 2021-2026 Idaho state yield (424 cwt/acre, state_reference_yields.csv): 0.90-0.93
    effect: {kind: risk, level: medium, yield_factor: [0.90, 0.93]}
    evidence_strength: moderate
    sources:
      - "SARE SW05-067, Long vs. Short Potato Rotations (Idaho), 2006 report"
    needs_local_review: true

  - id: sugarbeet_after_sugarbeet_yield_penalty
    title: Sugarbeet after sugarbeet yield drag
    category: pest_disease
    applies_to: {crops: [sugarbeets]}
    when:
      - {fact: history.consecutive_same_crop, op: ge, value: 1}
    # continuous beet against beet with a 1-3 year break (Liste et al. 1990, central Germany,
    # long-term trial, as quoted by Koch et al. 2018): 0.86 on a site free of beet cyst nematode;
    # 0.74 on a nematode-infested site with a susceptible variety (the 4-year break gave 35 %
    # more). The 0.52 of a 30-year monoculture (Rychcik and Zawislak 2002) is not a single repeat.
    effect: {kind: risk, level: medium, yield_factor: [0.74, 0.86]}
    evidence_strength: moderate
    sources:
      - "Koch et al. 2018, Frontiers in Plant Science 9:231, quoting Liste et al. 1990 (continuous beet vs 1-3 year breaks)"
    needs_local_review: true

  - id: sugarbeet_one_year_break_yield_penalty
    title: Sugarbeet after a one-year break yield drag
    category: pest_disease
    applies_to: {crops: [sugarbeets]}
    when:
      - {fact: history.years_since_same_crop, op: eq, value: 2}
    # beet every other year with wheat, Fairview ND 2000: fumigating the soil raised root yield
    # by nearly 14 %, so the untreated soil-borne loss is about 0.88; Liste's trial found 1, 2
    # and 3 year breaks alike (1.00). A 2-4 year break shows no difference (Koch et al. 2018).
    effect: {kind: risk, level: low, yield_factor: [0.88, 1.00]}
    evidence_strength: weak
    sources:
      - "Ashley, Bergman and Eckhoff 2001, Sugarbeets Grown on Fumigated Soils (NDSU Dickinson REC)"
      - "Koch et al. 2018, Frontiers in Plant Science 9:231 (no effect of 2, 3 or 4+ year intervals)"
    needs_local_review: true

  - id: pulse_after_pulse_yield_penalty
    title: Pulse after pulse yield drag
    category: pest_disease
    applies_to: {crops: [dry_peas, lentils]}
    when:
      - {fact: history.prev1.crop, op: in, value: [dry_peas, lentils, chickpeas]}
    # continuous pea against wheat-pea, Indian Head SK 1998-2007: 25 % lower (0.75); pea-pea-pea
    # against pea-wheat-pea, Swift Current SK: 2,376 / 2,581 kg/ha = 0.92 (2012) and 4,403 / 4,518
    # = 0.97 (2016, not significant). Continuous lentil at Swift Current did not lose yield (a
    # dry site with little Aphanomyces), so the range is from pea.
    effect: {kind: risk, level: medium, yield_factor: [0.75, 0.97]}
    evidence_strength: moderate
    sources:
      - "Lafond et al. 2011, Agronomy Journal, Intensification of field pea production (Indian Head SK)"
      - "Li et al. 2018, Frontiers in Plant Science 9:1488 (pulse rotations, Swift Current SK)"
    needs_local_review: true

  - id: pea_lentil_one_year_break_yield_penalty
    title: Pea or lentil after a one-year break yield drag
    category: pest_disease
    applies_to: {crops: [dry_peas, lentils]}
    when:
      - {fact: history.years_since_same_crop, op: eq, value: 2}
      - {fact: history.prev1.crop, op: not_in, value: [dry_peas, lentils, chickpeas]}
    # pea-wheat-pea against the diverse lentil-chickpea-pea rotation, Swift Current SK: 2,581 /
    # 2,913 = 0.89 (2012) and 4,518 / 4,690 = 0.96 (2016); wheat-pea and wheat-wheat-pea yielded
    # alike at Indian Head (1.00)
    effect: {kind: risk, level: low, yield_factor: [0.89, 1.00]}
    evidence_strength: weak
    sources:
      - "Li et al. 2018, Frontiers in Plant Science 9:1488 (pulse rotations, Swift Current SK)"
      - "Lafond et al. 2011, Agronomy Journal, Intensification of field pea production (Indian Head SK)"
    needs_local_review: true

  - id: chickpea_after_chickpea_yield_penalty
    title: Chickpea after chickpea yield drag
    category: pest_disease
    applies_to: {crops: [chickpeas]}
    when:
      - {fact: history.consecutive_same_crop, op: ge, value: 1}
    # continuous chickpea, Swift Current SK: 902 / 2,046 kg/ha = 0.44 against chickpea-wheat-
    # chickpea (2012) and 1,495 / 2,954 = 0.51 against lentil-wheat-chickpea (2016); root rot
    # 65 % against 8 % in the rotations. One site.
    effect: {kind: risk, level: high, yield_factor: [0.44, 0.51]}
    evidence_strength: weak
    sources:
      - "Li et al. 2018, Frontiers in Plant Science 9:1488 (pulse rotations, Swift Current SK)"
    needs_local_review: true

  - id: chickpea_after_other_pulse_yield_penalty
    title: Chickpea after pea or lentil yield drag
    category: pest_disease
    applies_to: {crops: [chickpeas]}
    when:
      - {fact: history.prev1.crop, op: in, value: [dry_peas, lentils]}
    # no trial measures chickpea after a different pulse; the pea and lentil range is used for
    # the shared root-rot pathogens (Fusarium, Pythium)
    effect: {kind: risk, level: medium, yield_factor: [0.75, 0.97]}
    evidence_strength: weak
    sources:
      - "Li et al. 2018, Frontiers in Plant Science 9:1488 (pulse rotations, Swift Current SK)"
      - "Lafond et al. 2011, Agronomy Journal, Intensification of field pea production (Indian Head SK)"
    needs_local_review: true

  - id: flax_after_flax_yield_penalty
    title: Flax after flax yield drag
    category: pest_disease
    applies_to: {crops: [flax]}
    when:
      - {fact: history.consecutive_same_crop, op: ge, value: 1}
    # Manitoba crop insurance (MASC) harvested fields 2000-12, flax yield by stubble: on flax 77
    # % of the average, on wheat 103, barley 98, oats 95, soybeans 99: 77 / 103 = 0.75 to 77 / 95
    # = 0.81. Farm records, not a trial; Fusarium wilt and pasmo build up (NDSU A1038).
    effect: {kind: risk, level: medium, yield_factor: [0.75, 0.81]}
    evidence_strength: moderate
    sources:
      - "Manitoba Flax Growers Association, Quick Tips (MASC yield by previous crop, 2000-2012)"
      - "NDSU Extension A1038, Flax Production in North Dakota"
    needs_local_review: true

  - id: pest_break_benefit
    title: Rotation breaks pest and disease cycles
    category: pest_disease
    applies_to: {groups: [warm_season_grain, small_grain, grain_legume, perennial_forage_legume, grass_hay_pasture, fiber_crop, root_crop, paddy_grain]}
    when:
      - {fact: history.prev1.crop, op: not_null}
      - {fact: history.shared_hosts_prev1, op: eq, value: []}
      - {fact: history.consecutive_same_family, op: eq, value: 0}
    effect: {kind: benefit}
    evidence_strength: moderate
    sources:
      - "ISU ICM News 2015; UNL CropWatch 2021; UKY PPFS-AG-C-10"
    needs_local_review: false
